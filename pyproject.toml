[project]
name = "trustworthy-ai-irm"
version = "0.1.0"
description = "Spurious Correlations & Invariant Learning (IRM vs ERM) on Colored-MNIST — Trustworthy AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
